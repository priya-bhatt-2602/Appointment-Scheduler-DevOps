
name: Appointment Scheduler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required project files
        run: |
          test -f index.html
          test -f book-appointment.html
          test -f my-appointments.html
          test -f js/app.js
          test -f css/style.css
          test -f tests/app.test.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run application tests
        run: node --test tests/app.test.js
